<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browser Agent Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#f5f3ee;
    --surface:#ffffff;
    --surface-2:#faf8f3;
    --border:#e3ddd0;
    --ink:#211f1b;
    --muted:#7c7568;
    --faint:#a39c8d;
    --accent:#2f6f5e;
    --accent-ink:#ffffff;
    --accent-soft:#e3efe9;
    --warning:#a9701d;
    --warning-soft:#f3e8d5;
    --critical:#ab3c2e;
    --critical-soft:#f6e2de;
    --idle:#8d8676;
    --shadow:0 1px 2px rgba(33,31,27,0.05), 0 4px 14px rgba(33,31,27,0.04);
  }
  :root[data-theme="dark"]{
    --bg:#15171a; --surface:#1c1f23; --surface-2:#202327; --border:#2b2f35;
    --ink:#eae7e0; --muted:#9a978e; --faint:#6d6a63;
    --accent:#57b79c; --accent-ink:#0c1a16; --accent-soft:#1e3530;
    --warning:#d9a24f; --warning-soft:#332714;
    --critical:#e17b6a; --critical-soft:#3a1f1a; --idle:#75726a;
    --shadow:0 1px 2px rgba(0,0,0,0.25), 0 6px 18px rgba(0,0,0,0.28);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15171a; --surface:#1c1f23; --surface-2:#202327; --border:#2b2f35;
      --ink:#eae7e0; --muted:#9a978e; --faint:#6d6a63;
      --accent:#57b79c; --accent-ink:#0c1a16; --accent-soft:#1e3530;
      --warning:#d9a24f; --warning-soft:#332714;
      --critical:#e17b6a; --critical-soft:#3a1f1a; --idle:#75726a;
      --shadow:0 1px 2px rgba(0,0,0,0.25), 0 6px 18px rgba(0,0,0,0.28);
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:ui-monospace,"SFMono-Regular","Cascadia Mono","Consolas","Liberation Mono",monospace; font-variant-numeric:tabular-nums; }
  .eyebrow{ font-size:11px; font-weight:700; letter-spacing:0.09em; text-transform:uppercase; color:var(--muted); }
  button, input, select, textarea{ font:inherit; color:inherit; }
  a{ color:inherit; text-decoration:none; }

  .app{ height:100vh; display:grid; grid-template-rows:52px 1fr; min-height:600px; }

  /* ---- Top bar ---- */
  .topbar{ display:flex; align-items:center; gap:14px; padding:0 18px; border-bottom:1px solid var(--border); background:var(--surface); flex-shrink:0; }
  .brand{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px; }
  .brand .mark{ width:18px;height:18px;border-radius:5px; background:var(--accent); display:inline-flex;align-items:center;justify-content:center; flex-shrink:0; }
  .brand .mark svg{ width:11px;height:11px; }
  .topbar .session-name{ color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topbar .session-name b{ color:var(--ink); font-weight:600; }
  .status-pill{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px 4px 8px; border-radius:999px; background:var(--surface-2); color:var(--idle); font-size:12px; font-weight:600; margin-left:auto; flex-shrink:0; }
  .status-pill .dot{ width:6px;height:6px;border-radius:50%; background:currentColor; }
  .status-pill.running{ background:var(--accent-soft); color:var(--accent); }
  .status-pill.running .dot{ animation:pulse 1.4s ease-in-out infinite; }
  .status-pill.done{ background:var(--accent-soft); color:var(--accent); }
  .status-pill.error{ background:var(--critical-soft); color:var(--critical); }
  .status-pill.cancelled{ background:var(--surface-2); color:var(--faint); }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
  @media (prefers-reduced-motion: reduce){ .status-pill.running .dot{ animation:none; } }
  .topbar-actions{ display:flex; gap:8px; flex-shrink:0; }
  .pool-text{ font-size:12px; color:var(--faint); white-space:nowrap; }
  .health-dot{ width:7px;height:7px;border-radius:50%; background:var(--faint); flex-shrink:0; }
  .health-dot.up{ background:var(--accent); }
  .theme-toggle{ display:flex; border:1px solid var(--border); border-radius:7px; overflow:hidden; }
  .theme-toggle button{ border:none; background:var(--surface); color:var(--muted); font-size:11px; font-weight:600; padding:5px 9px; cursor:pointer; }
  .theme-toggle button.active{ background:var(--accent); color:var(--accent-ink); }
  .theme-toggle button:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }

  /* ---- Settings button + dropdown panel (topbar) ---- */
  .icon-btn{ display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border:1px solid var(--border); border-radius:7px; background:var(--surface); color:var(--muted); cursor:pointer; flex-shrink:0; }
  .icon-btn svg{ width:15px; height:15px; }
  .icon-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .icon-btn.active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
  .settings-wrap{ position:relative; }
  .settings-panel{ display:none; position:absolute; top:calc(100% + 8px); right:0; z-index:20; width:300px; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); padding:14px; }
  .settings-panel.open{ display:block; }
  .settings-section + .settings-section{ margin-top:14px; padding-top:14px; border-top:1px solid var(--border); }
  .settings-label{ font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); margin-bottom:8px; }
  .settings-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .settings-row:last-child{ margin-bottom:0; }
  .settings-row label{ font-size:12.5px; color:var(--muted); }
  .settings-row select, .settings-row input[type=number]{ background:var(--surface-2); border:1px solid var(--border); color:var(--ink); border-radius:7px; padding:6px 8px; font-size:12.5px; }
  .settings-row select{ max-width:160px; }
  .settings-row input[type=number]{ width:70px; }
  .settings-panel .check-row{ margin-bottom:10px; align-items:flex-start; }
  .settings-panel .check-row:last-child{ margin-bottom:0; }
  .settings-panel .check-row input{ margin-top:2px; }
  .settings-panel #tabReusePolicyRow{ flex-direction:column; align-items:flex-start; gap:6px; }
  .settings-panel #tabReusePolicyRow select{ width:100%; max-width:none; }

  /* ---- Main grid ---- */
  .main{ display:grid; grid-template-columns:240px minmax(0,1fr) 320px; min-height:0; }
  .main.right-rail-hidden{ grid-template-columns:240px minmax(0,1fr); }
  .main.right-rail-hidden .right-rail{ display:none; }
  .col{ min-height:0; display:flex; flex-direction:column; border-right:1px solid var(--border); }
  .main > .col:last-child, .right-rail{ border-right:none; }
  .col-header{ padding:14px 16px 10px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; gap:8px; }
  .chat-header{ justify-content:flex-start; }
  .chat-header .eyebrow{ flex-shrink:0; }
  /* W_urllock: sized to comfortably fit a typical URL (not flex:1 growing to fill the whole
     header) so the pencil button sits right after it instead of stranded at the far right of
     a bar-length input — still allowed to shrink (not grow) on a narrow window. */
  .chat-url-input{ flex:0 1 380px; min-width:0; background:var(--surface-2); border:1px solid var(--border); color:var(--ink); border-radius:8px; padding:6px 10px; font-size:12.5px; }
  .chat-url-input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  /* W_urllock: once a turn exists for the conversation, the target URL is locked (readonly)
     — it was set the moment the task started, editing it afterward wouldn't retroactively
     change what already ran, and the "edit pencil" is there for the one case that's actually
     useful: overriding the target for the *next* follow-up turn. */
  .chat-url-input[readonly]{ background:transparent; color:var(--muted); cursor:default; }
  .btn-edit-url{ flex-shrink:0; width:26px; height:26px; border-radius:7px; border:1px solid var(--border); background:transparent; color:var(--faint); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .btn-edit-url:hover{ border-color:var(--accent); color:var(--accent); }
  .btn-edit-url svg{ width:13px; height:13px; }
  .col-body{ flex:1; min-height:0; overflow-y:auto; padding:0 8px 12px; }

  /* ---- History ---- */
  .history{ background:var(--surface-2); }
  .new-session{ margin:0 8px 10px; display:flex; align-items:center; justify-content:center; gap:6px; padding:8px 10px; border-radius:8px; border:1px dashed var(--faint); color:var(--muted); font-size:12.5px; font-weight:600; cursor:pointer; background:transparent; width:calc(100% - 16px); }
  .new-session:hover{ border-color:var(--accent); color:var(--accent); }
  .new-session.active{ border-style:solid; border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .history-group{ padding:10px 8px 2px; font-size:10.5px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--faint); }
  .list-item-wrap{ position:relative; }
  .list-item{ display:block; padding:9px 28px 9px 10px; border-radius:8px; cursor:pointer; margin-bottom:2px; border:none; background:none; width:100%; text-align:left; }
  .list-item:hover{ background:var(--surface); }
  .list-item.active{ background:var(--surface); box-shadow:0 0 0 1px var(--border); }
  .list-item .title{ font-size:13px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .list-item .meta{ display:flex; align-items:center; gap:6px; margin-top:3px; font-size:11.5px; color:var(--faint); }
  .kill-session-btn{ position:absolute; top:8px; right:6px; width:19px; height:19px; border:none; border-radius:5px; background:transparent; color:var(--faint); font-size:13px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .12s; }
  .list-item-wrap:hover .kill-session-btn{ opacity:1; }
  .kill-session-btn:hover{ background:var(--critical-soft); color:var(--critical); }
  .badge{ display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:700; padding:1px 6px; border-radius:5px; text-transform:uppercase; letter-spacing:.03em; }
  .badge.running{ background:var(--warning-soft); color:var(--warning); }
  .badge.done{ background:var(--accent-soft); color:var(--accent); }
  .badge.error{ background:var(--critical-soft); color:var(--critical); }
  .badge.cancelled{ background:var(--surface-2); color:var(--faint); }
  .badge.needs-approval{ background:var(--critical-soft); color:var(--critical); animation:pulse 1.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){ .badge.needs-approval{ animation:none; } }
  .empty-hint{ color:var(--faint); font-size:12.5px; padding:16px 12px; text-align:center; }

  /* ---- Chat ---- */
  .chat{ background:var(--surface); }
  .chat .col-body{ padding:18px 22px; display:flex; flex-direction:column; gap:14px; }
  /* W_live: fixed-height strip above the transcript showing the agent's live page view —
     flex-shrink:0 so it keeps its height regardless of how much chat/plan content is below
     it; the transcript below keeps scrolling in its own overflow-y:auto as before. Shrinks
     in width automatically along with the rest of the chat column when the Log rail toggles
     open (that's the .main grid's minmax(0,1fr) column doing its normal job, same as it
     always did for the chat area — no extra layout code needed for that part). */
  /* W_live: size is computed in JS (see fitLiveView()), not pure CSS — earlier attempts with
     CSS-only aspect-ratio kept losing one constraint or the other:
       - aspect-ratio + max-height alone: max-height wins over aspect-ratio while width still
         fills the full column via the margin below, breaking the ratio -> letterboxing.
       - aspect-ratio with no max-height: zero letterboxing, but nothing capped the size on a
         tall/wide window -> the box swallowed the whole screen (this is what was just
         reported — no room left to see chat below it).
     fitLiveView() picks whichever of (available column width) or (a height cap) is more
     restrictive and sizes both dimensions from *that one*, so the box's rendered ratio always
     equals the real image's ratio exactly — no bars, and never bigger than the height cap.
     align-self:center below opts this out of the flex column's default width:stretch so an
     explicit narrower width (from the height-cap case) doesn't get stretched back out. */
  .live-view{ flex-shrink:0; align-self:center; max-width:100%; margin:14px 22px 0; border-radius:10px; overflow:hidden; background:#000; display:flex; align-items:center; justify-content:center; border:1px solid var(--border); }
  .live-view img{ width:100%; height:100%; object-fit:contain; }
  .live-view-placeholder{ color:var(--faint); font-size:12.5px; text-align:center; padding:0 20px; }
  /* explicit divider line between the live-view box and the chat transcript below it — the
     18px top padding of .chat .col-body already left a visual gap there, but with nothing
     drawn in it the two areas read as blending together; shown/hidden together with
     #liveView itself (see renderLiveView()). */
  .live-view-divider{ flex-shrink:0; height:1px; background:var(--border); margin:14px 22px 0; }
  .transcript-empty{ margin:auto; text-align:center; color:var(--faint); font-size:13px; max-width:280px; }
  .msg{ display:flex; gap:10px; max-width:100%; }
  .msg .avatar{ width:26px;height:26px;border-radius:7px;flex-shrink:0; display:flex;align-items:center;justify-content:center; font-size:11px;font-weight:700; }
  .msg.user{ align-self:flex-end; flex-direction:row-reverse; }
  .msg.user .avatar{ background:var(--surface-2); color:var(--muted); border:1px solid var(--border); }
  .msg.agent .avatar{ background:var(--accent); color:var(--accent-ink); }
  .bubble{ padding:10px 13px; border-radius:12px; font-size:13.5px; line-height:1.55; max-width:440px; white-space:pre-wrap; }
  .msg.user .bubble{ background:var(--surface-2); border:1px solid var(--border); border-top-right-radius:3px; }
  .msg.agent .bubble{ background:var(--accent-soft); border-top-left-radius:3px; }
  .msg.agent.error .bubble{ background:var(--critical-soft); color:var(--critical); }
  .stat-line{ display:flex; gap:12px; font-size:11.5px; color:var(--faint); margin-top:5px; }

  /* ---- Human-in-the-loop approval cards ---- */
  .approval-bubble{ background:var(--warning-soft) !important; border:1px solid var(--warning); max-width:440px; }
  .approval-title{ font-weight:700; font-size:12px; color:var(--warning); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }
  .approval-cmd{ font-size:12px; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:6px 8px; margin-bottom:10px; word-break:break-word; }
  .approval-actions{ display:flex; gap:8px; }
  .btn-approve, .btn-deny{ flex:1; border:none; border-radius:7px; padding:7px 10px; font-size:12.5px; font-weight:700; cursor:pointer; }
  .btn-approve{ background:var(--accent); color:var(--accent-ink); }
  .btn-deny{ background:var(--critical); color:#fff; }
  .btn-approve:hover, .btn-deny:hover{ filter:brightness(1.08); }
  .btn-edit{ flex:0 0 auto; border:1px solid var(--border); background:transparent; color:var(--muted); border-radius:7px; padding:7px 14px; font-size:12.5px; font-weight:700; cursor:pointer; }
  .btn-edit:hover{ border-color:var(--accent); color:var(--accent); }

  /* ---- Plan bubble (shown live in the chat as soon as it's drafted) ---- */
  .plan-bubble{ background:var(--accent-soft) !important; border:1px solid var(--accent); max-width:460px; }
  .plan-bubble-title{ font-weight:700; font-size:12px; color:var(--accent); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; display:flex; align-items:center; gap:6px; }
  .plan-bubble-title .plan-badge{ font-size:10px; padding:1px 7px; border-radius:5px; font-weight:700; text-transform:none; letter-spacing:0; }
  .plan-badge.ok{ background:var(--accent); color:var(--accent-ink); }
  .plan-badge.fail{ background:var(--critical-soft); color:var(--critical); }
  .plan-badge.running{ background:var(--surface-2); color:var(--muted); border:1px solid var(--border); }
  .plan-bubble-text{ font-size:13px; line-height:1.6; white-space:pre-wrap; color:var(--ink); margin-bottom:8px; }
  /* W_planrail: real-time checklist of a numbered plan ("1. ... \n2. ..."), now rendered in
     the right-rail Plan panel (see renderPlanPanel()) instead of an inline chat bubble —
     each line ticks off as the agent completes it (plan_step_done SSE events) or all at once
     the moment the whole task finishes successfully (a task can finish "faster" than every
     individual per-step signal arrives/gets acted on — see renderPlanPanel()'s allDone).
     Tighter spacing than a chat bubble needs since this now lives in a narrow persistent
     rail column, not a wide one-off message. */
  .plan-checklist{ list-style:none; margin:0; padding:8px; display:flex; flex-direction:column; gap:4px; }
  .plan-checklist-item{ display:flex; align-items:flex-start; gap:7px; font-size:12.5px; line-height:1.4; color:var(--ink); }
  .plan-checklist-box{ flex:0 0 auto; width:15px; height:15px; margin-top:1px; border-radius:4px; border:1.5px solid var(--faint); display:flex; align-items:center; justify-content:center; font-size:10px; line-height:1; color:var(--accent-ink); transition:background-color .15s, border-color .15s; }
  .plan-checklist-item.done .plan-checklist-box{ background:var(--accent); border-color:var(--accent); }
  .plan-checklist-item.done .plan-checklist-text{ color:var(--muted); text-decoration:line-through; text-decoration-color:var(--faint); }
  .plan-edit-textarea{ width:100%; background:var(--surface); border:1px solid var(--border); color:var(--ink); border-radius:6px; padding:8px; font-size:13px; font-family:inherit; line-height:1.6; resize:vertical; min-height:110px; margin-bottom:8px; }
  .plan-edit-textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  /* W14: Website Learning banner (crawl progress / done / error) — W23: no more
     "missing"/"known" static states here, that's just the header button now (see
     .manual-banner-learn-btn under #btnLearnSite in the chat-header) */
  .manual-banner-wrap{ flex-shrink:0; padding:10px 16px 0; }
  .manual-banner{ border-radius:8px; padding:10px 12px; font-size:12.5px; }
  .manual-banner.learning{ background:var(--accent-soft); border:1px solid var(--accent); }
  .manual-banner.learning .manual-banner-title{ color:var(--accent); font-weight:700; margin-bottom:6px; }
  .manual-banner-current{ color:var(--muted); font-size:11.5px; margin-bottom:4px; word-break:break-all; }
  .manual-banner-checklist{ display:flex; flex-direction:column; gap:2px; margin:4px 0; max-height:110px; overflow-y:auto; }
  .manual-banner-checklist .item.done{ color:var(--accent); }
  .manual-banner-checklist .item.pending{ color:var(--faint); }
  .manual-banner-pct{ font-weight:700; margin-top:6px; }
  .manual-banner-errors{ color:var(--warning); font-size:11.5px; margin-top:6px; word-break:break-all; }
  .manual-banner.done{ background:var(--accent-soft); border:1px solid var(--accent); color:var(--accent); }
  .manual-banner-summary{ margin-top:6px; font-size:12px; line-height:1.5; color:var(--ink); }
  .manual-banner.error{ background:var(--critical-soft); border:1px solid var(--critical); color:var(--critical); }
  .manual-banner-learn-btn{ flex:0 0 auto; border:none; border-radius:7px; padding:7px 14px; font-size:12.5px; font-weight:700; cursor:pointer; background:var(--warning); color:#1a1200; }
  .manual-banner-learn-btn:hover{ filter:brightness(1.08); }

  /* W23: mid-crawl "this site needs login" prompt — crawler paused, waiting for the
     user to answer via respondLearnCredentials() */
  .manual-banner-cred-request{ margin-top:8px; padding-top:8px; border-top:1px solid var(--accent); }
  .manual-banner-cred-request-title{ font-weight:700; margin-bottom:6px; }
  .manual-banner-login-fields{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .manual-banner-login-fields input{ flex:1 1 140px; min-width:0; padding:5px 8px; font-size:12px; border-radius:6px; border:1px solid var(--accent); background:var(--bg); color:var(--ink); }
  .manual-banner-cred-request-actions{ display:flex; gap:8px; }
  .manual-banner-skip-btn{ flex:0 0 auto; border:1px solid var(--border); border-radius:7px; padding:7px 14px; font-size:12.5px; font-weight:700; cursor:pointer; background:transparent; color:var(--muted); }
  .manual-banner-skip-btn:hover{ border-color:var(--accent); color:var(--accent); }

  .composer{ flex-shrink:0; border-top:1px solid var(--border); padding:12px 16px 16px; display:flex; flex-direction:column; gap:6px; }
  .check-row{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
  .check-row input{ width:auto; }
  .check-row .warn-hint{ color:var(--warning); font-size:10.5px; }
  .composer-error{ font-size:12px; color:var(--critical); }

  /* ---- Pill-shaped composer bar (chat-input style: + attach / textarea / stop) ---- */
  .composer-bar{ display:flex; align-items:flex-end; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:22px; padding:6px 8px 6px 6px; }
  .composer .composer-bar textarea{ flex:1; min-width:0; background:transparent; border:none; color:var(--ink); font-size:13px; padding:7px 6px; resize:none; min-height:24px; max-height:120px; }
  .composer .composer-bar textarea:focus{ outline:none; }
  .icon-round-btn{ flex-shrink:0; width:30px; height:30px; border-radius:50%; border:none; background:var(--surface); color:var(--muted); font-size:19px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .icon-round-btn:hover{ background:var(--border); color:var(--ink); }
  .stop-icon-btn{ flex-shrink:0; width:30px; height:30px; border-radius:8px; border:none; background:var(--critical); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .stop-icon-btn svg{ width:14px; height:14px; }
  .stop-icon-btn:hover{ filter:brightness(1.08); }
  .stop-icon-btn:disabled{ opacity:.5; cursor:not-allowed; }

  /* ---- Attach-file dropdown — UI shell only, no upload/parsing wired up yet ---- */
  .attach-wrap{ position:relative; flex-shrink:0; }
  .attach-menu{ display:none; position:absolute; bottom:calc(100% + 8px); left:0; z-index:20; min-width:220px; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); padding:6px; }
  .attach-menu.open{ display:block; }
  .attach-menu-item{ width:100%; display:flex; flex-direction:column; align-items:flex-start; gap:2px; padding:8px 10px; border:none; background:none; border-radius:7px; cursor:pointer; text-align:left; color:var(--ink); font-size:13px; font-weight:600; }
  .attach-menu-item:hover{ background:var(--surface-2); }
  .attach-menu-sub{ font-size:11px; font-weight:500; color:var(--faint); }

  /* ---- Log toggle (manual show/hide — see .right-rail-hidden on .main) ---- */
  .log-toggle-btn{ border:1px solid var(--border); background:var(--surface-2); color:var(--muted); font-size:11px; font-weight:600; padding:4px 10px; border-radius:7px; cursor:pointer; flex-shrink:0; }
  .log-toggle-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .log-toggle-btn.active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }

  /* ---- Right rail: Plan + Log — each .col is a flex item so when both are visible at
     once they split the rail's height 50/50 automatically (equal flex:1, no basis set);
     when only one is visible the other is display:none so the visible one just fills 100%
     on its own — no separate "solo" CSS path needed. */
  .right-rail{ display:flex; flex-direction:column; min-height:0; }
  .right-rail .col{ border-right:none; flex:1; min-height:0; }
  .right-rail .col:not(:last-child){ border-bottom:1px solid var(--border); }
  .log-placeholder{ color:var(--faint); font-size:12.5px; padding:8px 8px; }

  .log-line{ display:flex; gap:8px; padding:4px 8px; font-size:11.5px; border-radius:6px; align-items:baseline; }
  .log-line:hover{ background:var(--surface-2); }
  .log-line .t{ color:var(--faint); flex-shrink:0; width:20px; text-align:right; }
  .log-line .lvl{ flex-shrink:0; width:38px; font-weight:700; }
  .log-line .lvl.info{ color:var(--muted); }
  .log-line .lvl.ok{ color:var(--accent); }
  .log-line .lvl.err{ color:var(--critical); }
  .log-line .msg-text{ color:var(--ink); overflow-wrap:anywhere; }
  .log-line .result-text{ color:var(--faint); overflow-wrap:anywhere; }

  @media (max-width:920px){
    .main{ grid-template-columns:1fr; grid-template-rows:auto 1fr auto; }
    .col{ border-right:none; border-bottom:1px solid var(--border); }
    .history{ max-height:180px; }
    .right-rail{ max-height:280px; }
    .live-view{ margin:10px 14px 0; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12a8 8 0 1 1 8 8" stroke="white" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="4" r="1.6" fill="white"/></svg></span>
      Browser Agent
    </div>
    <div class="session-name" id="sessionName">New session</div>
    <div class="status-pill idle" id="statusPill"><span class="dot"></span><span id="statusText">Idle</span></div>
    <div class="topbar-actions">
      <span class="health-dot" id="healthDot" title="API health"></span>
      <span class="pool-text" id="poolText">pool —</span>
      <div class="settings-wrap">
        <button class="icon-btn" id="btnSettings" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
        <div class="settings-panel" id="settingsPanel">
          <div class="settings-section">
            <div class="settings-label">Appearance</div>
            <div class="settings-row">
              <label>Theme</label>
              <div class="theme-toggle" id="themeToggle">
                <button data-theme="light">Light</button>
                <button data-theme="dark">Dark</button>
              </div>
            </div>
            <div class="settings-row">
              <label>Log panel</label>
              <button class="log-toggle-btn" id="btnToggleLog">Show log</button>
            </div>
          </div>
          <div class="settings-section">
            <div class="settings-label">Run configuration</div>
            <div class="settings-row">
              <label for="provider">Provider</label>
              <select id="provider">
                <option value="">default</option>
                <option value="anthropic">Anthropic</option>
                <option value="gemini">Gemini</option>
                <option value="groq">Groq</option>
              </select>
            </div>
            <div class="settings-row">
              <label for="maxSteps">Max steps</label>
              <input type="number" id="maxSteps" value="30" min="1" max="200">
            </div>
            <label class="check-row"><input type="checkbox" id="headless" checked> Headless (hide the browser window) <span class="warn-hint">(watch progress in the Live view above instead — uncheck only if you need to interact with the real window yourself, e.g. to solve a CAPTCHA)</span></label>
            <label class="check-row"><input type="checkbox" id="useUserBrowser"> Use my browser <span class="warn-hint">(opens a new tab in your own Chrome instead of a separate window — requires Chrome already running with --remote-debugging-port; see run.py "real-browser" docstring for setup)</span></label>
            <label class="check-row" id="tabReusePolicyRow" style="display:none;">
              Continuing in that tab:
              <select id="tabReusePolicy">
                <option value="ask">Ask each time (default, safest)</option>
                <option value="always_reuse">Always continue in the same tab (no prompts)</option>
                <option value="always_new_tab">Always open a new tab</option>
              </select>
            </label>
            <label class="check-row"><input type="checkbox" id="autoApprove"> Auto-approve permission prompts <span class="warn-hint">(lets the agent act without asking)</span></label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="main right-rail-hidden" id="mainGrid">
    <!-- HISTORY -->
    <div class="col history">
      <div class="col-header"><span class="eyebrow">History</span></div>
      <div class="col-body">
        <button class="new-session" id="btnNewSession">+ New session</button>
        <div id="historyList"></div>
      </div>
    </div>

    <!-- CHAT -->
    <div class="col chat">
      <div class="col-header chat-header">
        <span class="eyebrow">Chat</span>
        <input type="url" id="url" placeholder="Target URL — https://www.example.com" value="https://www.saucedemo.com/" list="urlHistory" autocomplete="off" class="chat-url-input" aria-label="Target URL" title="Target URL">
        <datalist id="urlHistory"></datalist>
        <button type="button" id="btnEditUrl" class="btn-edit-url" title="Edit target URL" aria-label="Edit target URL" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button type="button" id="btnLearnSite" class="manual-banner-learn-btn" data-learn-site="true" style="display:none;"></button>
      </div>
      <div class="live-view" id="liveView" style="display:none;">
        <img id="liveViewImg" alt="Live view of the page the agent is controlling" style="display:none;">
        <div class="live-view-placeholder" id="liveViewPlaceholder">No live preview yet — starts once a task begins.</div>
      </div>
      <div class="live-view-divider" id="liveViewDivider" style="display:none;"></div>
      <div class="col-body" id="transcript"></div>
      <div class="manual-banner-wrap" id="manualBanner" style="display:none;"></div>
      <div class="composer">
        <div class="composer-bar">
          <div class="attach-wrap">
            <button class="icon-round-btn" id="btnAttach" title="Attach a file" aria-label="Attach a file" type="button">+</button>
            <div class="attach-menu" id="attachMenu">
              <!-- UI shell only for now, per request — no upload/parsing wired up yet.
                   Clicking this just closes the menu (see the [data-attach-placeholder]
                   handler below); nothing is read, stored, or sent anywhere. -->
              <button class="attach-menu-item" data-attach-placeholder="true" type="button">
                <span>Attach file</span>
                <span class="attach-menu-sub">.txt · .pdf · .docx · .xlsx · image</span>
              </button>
            </div>
          </div>
          <textarea id="goal" rows="1" placeholder="e.g. add the first item to cart and checkout"></textarea>
          <button class="stop-icon-btn" id="btnStop" style="display:none;" title="Stop" aria-label="Stop task" type="button">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
          </button>
        </div>
        <span class="composer-error" id="composerError"></span>
      </div>
    </div>

    <!-- RIGHT RAIL: Plan (shows once a plan is approved) + Log (manual toggle) — split
         50/50 vertically when both are visible at once (see updateRightRailVisibility()). -->
    <div class="right-rail">
      <div class="col plan-panel" id="planPanel" style="display:none;">
        <div class="col-header"><span class="eyebrow">Plan</span><span id="planBadgeSlot"></span></div>
        <div class="col-body" id="planBody"></div>
      </div>
      <div class="col log" id="logPanel">
        <div class="col-header"><span class="eyebrow">Log</span><span class="mono" id="logCount" style="font-size:11px;color:var(--faint)"></span></div>
        <div class="col-body mono" id="logBody"><div class="log-placeholder">Select or start a task to see its step log.</div></div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const API = "";

let tasks = [];          // last known snapshot from GET /tasks
let selectedConvId = null; // conversation currently shown in Chat/Log, or null = "new session"
const liveSteps = {};        // task_id -> [{step, cmd, result, success}, ...] from SSE, real-time
// W49: task_id -> {input, output, cache_read, cache_creation} — cumulative token usage from
// the latest "step" SSE event, so the sidebar can show a running total while status is still
// "running" (task.result.tokens only exists once the task is fully done, see task_done below).
const liveTokens = {};
// W_live: task_id -> latest "data:image/jpeg;base64,..." screenshot from the "screenshot" SSE
// event (see orchestrator.py::_emit_screenshot) — lets the console show a live view of the
// page the agent is controlling instead of the user having to alt-tab to the real browser
// window. Kept (not cleared) after the task finishes so the final page state stays visible.
const liveScreens = {};
const pendingApprovals = {}; // task_id -> {request_id, cmd} — awaiting a human decision right now (permission prompts during a run)
// W13: plan review now happens *before* any task exists — POST /api/generate_plan
// returns the plan synchronously, the user reviews/edits/approves it locally, and only
// then does POST /api/execute_plan actually create a task. pendingPlan holds that
// in-review state; there is at most one at a time (the composer is disabled while one
// is pending — see requestPlan()).
let pendingPlan = null;      // { sessionId, url, goal, planDraft, requestParams } | null
// There's no visible "Plan task" button anymore (removed in favor of Enter-to-submit,
// chat-composer style) — this replaces what used to be $("btnRun").disabled to gate
// against double-submitting while a generate_plan request is already in flight.
let planRequestInFlight = false;
// W_instant: set the instant the user submits a goal, cleared once the /api/generate_plan
// response lands (either as pendingPlan or as a running task for is_qa replies) — lets
// renderTranscript() show the goal + a "Generating plan…" bubble immediately instead of
// the composer looking unresponsive for the several seconds that LLM call actually takes.
let planGenerating = null;  // { sessionId, goal } | null
const runningPlans = {};     // task_id -> plan text, set right when execute_plan succeeds so the
                              // approved plan stays visible in the chat while the task is still
                              // running (task.result.plan only exists once it's done)
const liveConnections = {};  // task_id -> EventSource, one live stream per running task
const liveChatReplies = {};  // task_id -> chat reply message for Q&A summarization intent
// W43: task_id -> Set of plan step indices (1-based) the agent has confirmed complete via
// real-time "plan_step_done" SSE events (see handleStreamEvent()/parsePlanSteps()) — never
// removed from once added, even if the agent later revisits/retries an action related to
// that step, so a checked box doesn't flicker back to unchecked mid-run.
const completedPlanSteps = {};
let logVisible = false;      // Log panel is collapsed until the user explicitly clicks "Show log"
// W_urllock: true while the pencil-edit toggle is active for the *current* turn — while
// true, renderTopbar() leaves the URL field alone (unlocked, not overwritten with
// latest.url) so the user's in-progress edit survives the 2.5s task poll re-render. Reset
// to false on conversation switch, "New session", and right when a new turn is actually
// submitted (see approvePlanWithPayload()) so the field re-locks for that new turn.
let urlUnlocked = false;


// W14: Website Learning & Manual Generation — banner shown above the composer when the
// current Target URL's site has no manual yet, plus live progress while crawling it.
// W23: no more upfront username/password fields here — learnProgress.credentialsRequest
// ({ requestId, domain } | null) holds a *mid-crawl* prompt instead, set when the
// crawler itself hits a login page and asks via the "credentials_needed" SSE event
// (see openLearnStream()) rather than requiring them to be typed in before starting.
let siteManualStatus = null; // { exists, version } for the current url, or null = not checked yet
let learnProgress = null;    // { learnId, done, total, checklist: [names], status, version?, errorMessage?, credentialsRequest? } | null
let manualCheckTimer = null; // debounce handle for checkSiteManualStatus()

// ---- Conversations: the backend only knows about individual tasks (one orchestrator
// run each), but the UI groups a sequence of them into one continuous chat thread so
// you can send a follow-up command without starting a "New session" every time.
// Persisted in localStorage (task_id -> conversation membership) so a page reload
// doesn't scatter an existing thread back into separate history entries.
const CONV_STORAGE_KEY = "agentConsoleConversations";
let conversations = {}; // { [convId]: [task_id, task_id, ...] } in submission order
try {
  conversations = JSON.parse(localStorage.getItem(CONV_STORAGE_KEY) || "{}");
} catch (e) {
  conversations = {};
}

// W_fix: selectedConvId itself was never persisted (only `conversations` membership was)
// — a plain page reload silently dropped it back to null ("new session") even though the
// sidebar still showed the old thread selected. The next follow-up command then minted a
// brand-new session_id (see requestPlan()'s `selectedConvId || newSessionId()`), which the
// backend correctly treated as an unrelated session and opened a second browser window for
// — the bug the user reported (two Chrome windows playing different videos at once). Restore
// it here, but only if it still refers to a thread `conversations` actually knows about (a
// stale/garbage id just falls back to "new session" same as before).
const SELECTED_CONV_KEY = "agentConsoleSelectedConv";
function setSelectedConvId(id) {
  selectedConvId = id;
  try {
    if (id) localStorage.setItem(SELECTED_CONV_KEY, id);
    else localStorage.removeItem(SELECTED_CONV_KEY);
  } catch (e) {}
}
try {
  const storedConvId = localStorage.getItem(SELECTED_CONV_KEY);
  if (storedConvId && conversations[storedConvId]) selectedConvId = storedConvId;
} catch (e) {}

// ---- Blacklist: เก็บ session id และ task_id ที่ผู้ใช้ตั้งใจลบไปแล้ว (กด ×)
// บันทึกลง localStorage เพื่อป้องกันไม่ให้ refreshTasks() สร้าง conversation กลับมาใหม่เมื่อดึง tasks จาก backend
const DELETED_CONV_KEY = "agentConsoleDeletedConvs";
let deletedConvs = {}; // { [id]: true }
try {
  deletedConvs = JSON.parse(localStorage.getItem(DELETED_CONV_KEY) || "{}");
} catch (e) {
  deletedConvs = {};
}

// 🔥 เพิ่ม: sync deletedConvs → deletedTaskIds Set สำหรับ filter ใน refreshTasks()
let deletedTaskIds = new Set();
for (const key in deletedConvs) {
  if (deletedConvs[key]) deletedTaskIds.add(key);
}

function saveConversations() {
  try { localStorage.setItem(CONV_STORAGE_KEY, JSON.stringify(conversations)); } catch (e) {}
}

function saveDeletedConvs() {
  try { localStorage.setItem(DELETED_CONV_KEY, JSON.stringify(deletedConvs)); } catch (e) {}
}

// ---- Target URL history: remembered client-side (localStorage) so it survives a page
// reload/server restart independently of task history (which lives in the backend's
// in-memory TaskManager and is lost on restart) — feeds the <datalist> under the
// "Target URL" field so previously used sites show up as suggestions while typing.
const URL_HISTORY_KEY = "agentConsoleUrlHistory";
const URL_HISTORY_MAX = 20;
let urlHistory = [];
try {
  urlHistory = JSON.parse(localStorage.getItem(URL_HISTORY_KEY) || "[]");
} catch (e) {
  urlHistory = [];
}

function renderUrlHistory() {
  $("urlHistory").innerHTML = urlHistory.map((u) => `<option value="${escapeHtml(u)}"></option>`).join("");
}

function rememberUrl(url) {
  url = (url || "").trim();
  if (!url) return;
  urlHistory = [url, ...urlHistory.filter((u) => u !== url)].slice(0, URL_HISTORY_MAX);
  try { localStorage.setItem(URL_HISTORY_KEY, JSON.stringify(urlHistory)); } catch (e) {}
  renderUrlHistory();
}

function conversationIdForTask(taskId) {
  for (const convId in conversations) {
    if (conversations[convId].includes(taskId)) return convId;
  }
  return null;
}

// Tasks the backend already knows about that this browser hasn't grouped yet (first
// time seeing them — e.g. created before this feature existed, or from another tab)
// each get their own solo conversation so they still show up in the history list.
function ensureConversationFor(taskId) {
  if (deletedTaskIds.has(taskId)) return null;
  const existing = conversationIdForTask(taskId);
  if (existing) return existing;
  const convId = "conv-" + taskId;
  if (deletedTaskIds.has(convId)) return null;
  conversations[convId] = [taskId];
  saveConversations();
  return convId;
}

function tasksInConversation(convId) {
  const ids = conversations[convId] || [];
  return ids.map((id) => tasks.find((t) => t.task_id === id)).filter(Boolean);
}

function latestTaskInConversation(convId) {
  const ts = tasksInConversation(convId);
  return ts.length ? ts[ts.length - 1] : null;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

// W43: parse a plan's numbered-list text ("1. ... \n2. ...", the format the backend's
// plan prompt now enforces — see llm.py::_PLAN_PROMPT_TEMPLATE) into individual steps so
// renderTaskTurn() can show each as its own checklist row and tick it off in real time as
// "plan_step_done" events arrive (see handleStreamEvent()). Returns [] for text that
// doesn't match the numbered format at all (e.g. an older plan generated before this
// format was enforced, or a malformed one) — the caller falls back to the old plain-text
// rendering in that case so nothing silently disappears.
function parsePlanSteps(planText) {
  const steps = [];
  for (const line of String(planText || "").split("\n")) {
    const m = line.match(/^\s*(\d+)\.\s*(.+)$/);
    if (m) steps.push({ index: parseInt(m[1], 10), text: m[2].trim() });
  }
  return steps;
}

// W_planrail: the pre-approval review bubble (renderPendingPlanTurn()) used to render the
// raw plan text with white-space:pre-wrap, which meant any blank line the model left between
// numbered steps showed up as literal empty space in the bubble. Reusing parsePlanSteps()
// here (same numbered-list parse used by the post-approval right-rail panel) sidesteps that
// entirely — blank lines just aren't steps, so they never make it into the list at all — and
// gives the reviewer the same compact one-row-per-step layout instead of a wall of text.
// Falls back to the plain preformatted block only for text that doesn't parse into numbered
// steps at all, same as parsePlanSteps()'s other caller.
function renderPlanPreviewList(planText) {
  const steps = parsePlanSteps(planText);
  if (!steps.length) return `<div class="plan-bubble-text">${escapeHtml(planText)}</div>`;
  return `<ul class="plan-checklist">${steps.map((step) => `
        <li class="plan-checklist-item">
          <span class="plan-checklist-box"></span>
          <span class="plan-checklist-text">${escapeHtml(step.text)}</span>
        </li>`).join("")}</ul>`;
}

function fmtTime(epochSeconds) {
  return new Date(epochSeconds * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

// W49: task.result.tokens (once done) takes priority over liveTokens (still running) since
// it's the authoritative final total — see handleStreamEvent()/task_manager.py::_log_token_usage().
function getTaskTokens(task) {
  if (!task) return null;
  return (task.result && task.result.tokens) || liveTokens[task.task_id] || null;
}

function formatTokens(t) {
  if (!t) return null;
  const total = (t.input || 0) + (t.output || 0) + (t.cache_read || 0) + (t.cache_creation || 0);
  if (!total) return null;
  return total >= 1000 ? `${(total / 1000).toFixed(1)}k tok` : `${total} tok`;
}

// W49: sum token usage across every turn in a conversation (a "session" can be several
// follow-up tasks — see tasksInConversation()) so the sidebar shows total cost of the whole
// session, not just its latest turn.
function sumConvTokens(convTasks) {
  const sum = { input: 0, output: 0, cache_read: 0, cache_creation: 0 };
  for (const t of convTasks) {
    const tok = getTaskTokens(t);
    if (!tok) continue;
    sum.input += tok.input || 0;
    sum.output += tok.output || 0;
    sum.cache_read += tok.cache_read || 0;
    sum.cache_creation += tok.cache_creation || 0;
  }
  return sum;
}

function dayLabel(epochSeconds) {
  const d = new Date(epochSeconds * 1000);
  const today = new Date();
  const yest = new Date(today); yest.setDate(today.getDate() - 1);
  const sameDay = (a, b) => a.toDateString() === b.toDateString();
  if (sameDay(d, today)) return "Today";
  if (sameDay(d, yest)) return "Yesterday";
  return d.toLocaleDateString([], { month: "short", day: "numeric" });
}

function formatCmd(cmd) {
  if (!cmd || typeof cmd !== "object") return String(cmd);
  const type = cmd.type || "action";
  const rest = Object.entries(cmd)
    .filter(([k]) => k !== "type")
    .map(([k, v]) => `${k}=${typeof v === "string" ? JSON.stringify(v) : v}`)
    .join(" ");
  return rest ? `${type} ${rest}` : type;
}

const ACTION_VERBS = {
  click: "Click", submit: "Submit", delete: "Delete", purchase: "Purchase", pay: "Pay", check: "Check",
};

// Human-readable line for the Log panel: prefers the element's real name (h.label, from
// perception.py — the button/field text on the page) over raw index numbers, since a
// bare index means nothing to a person watching the log.
function describeCmd(h) {
  const cmd = h.cmd || {};
  const type = cmd.type || "action";
  const target = h.label ? `"${h.label}"` : (cmd.index !== undefined ? `#${cmd.index}` : "");

  if (type === "goto") return `Go to ${cmd.url || ""}`;
  if (type === "fill") {
    const field = target || "field";
    return `Fill ${field}: ${JSON.stringify(cmd.text ?? "")}`;
  }
  if (type === "select") {
    const field = target || "dropdown";
    return `Select ${field}: ${JSON.stringify(cmd.label ?? "")}`;
  }
  if (type === "scroll") return `Scroll ${cmd.direction || "down"}`;
  if (type === "go_back") return "Go back";
  if (type === "switch_tab") return `Switch to tab ${cmd.tab_index}`;
  if (type === "wait") return "Wait for page to settle";
  if (ACTION_VERBS[type]) return target ? `${ACTION_VERBS[type]} ${target}` : ACTION_VERBS[type];
  return formatCmd(cmd);
}

function truncate(s, n) {
  s = String(s);
  return s.length > n ? s.slice(0, n - 1) + "…" : s;
}

// 🔥 แก้ไข: refreshTasks() — ใช้ deletedTaskIds Set ที่ sync กับ deletedConvs แล้ว
async function refreshTasks() {
  try {
    const r = await fetch(API + "/tasks");
    if (!r.ok) return;
    tasks = await r.json();
    tasks.sort((a, b) => b.created_at - a.created_at);

    // 🔥 กรอง tasks ที่ถูกลบออก (ใช้ deletedTaskIds)
    tasks = tasks.filter(t => !deletedTaskIds.has(t.task_id));

    for (const t of tasks) {
      ensureConversationFor(t.task_id);
      // Reconnect live streams for any task still running (e.g. after a page reload)
      // so pending approvals / step updates aren't silently missed.
      if (t.status === "running") openStream(t.task_id);
    }

    // ทำความสะอาด deletedTaskIds — เอา task_id ที่ไม่อยู่ใน backend แล้วออก
    const currentTaskIds = new Set(tasks.map(t => t.task_id));
    for (const taskId of deletedTaskIds) {
      if (!currentTaskIds.has(taskId)) {
        // เก็บไว้ก่อน เผื่อ backend restart แล้ว task กลับมาใหม่
      }
    }

    renderHistory();
    renderSelected();
  } catch (e) {}
}

// ---------------- Real-time stream (SSE) + human-in-the-loop ----------------

function openStream(taskId) {
  if (liveConnections[taskId]) return;
  const es = new EventSource(`${API}/tasks/${taskId}/stream`);
  liveConnections[taskId] = es;
  es.onmessage = (ev) => {
    let event;
    try { event = JSON.parse(ev.data); } catch (e) { return; }
    handleStreamEvent(taskId, event);
  };
  es.onerror = () => {
    es.close();
    delete liveConnections[taskId];
  };
}

function closeStream(taskId) {
  const es = liveConnections[taskId];
  if (es) {
    es.close();
    delete liveConnections[taskId];
  }
}

// 🔥 แก้ไข: อัพเดท task status ทันทีเมื่อได้รับ task_done event
function handleStreamEvent(taskId, event) {
  if (event.kind === "step") {
    (liveSteps[taskId] || (liveSteps[taskId] = [])).push(event);
    if (event.tokens) liveTokens[taskId] = event.tokens;
  } else if (event.kind === "screenshot") {
    liveScreens[taskId] = event.image;
  } else if (event.kind === "chat_reply") {
    liveChatReplies[taskId] = event.message;
  } else if (event.kind === "approval_request") {
    // W13: this is always a permission prompt for an action now — plan review happens
    // before the task exists at all (see requestPlan()/approvePlan()), so a
    // task submitted via execute_plan never emits a "confirm_plan" kind here.
    pendingApprovals[taskId] = { request_id: event.request_id, cmd: event.cmd };
  } else if (event.kind === "auto_approved") {
    (liveSteps[taskId] || (liveSteps[taskId] = [])).push({
      step: null, cmd: event.cmd, result: "Auto-approved (auto-approve enabled)", success: true,
    });
  } else if (event.kind === "plan_step_done") {
    // W43: never delete/unset once added (see completedPlanSteps declaration) — a
    // checked box should stay checked even if the agent revisits that part of the page.
    (completedPlanSteps[taskId] || (completedPlanSteps[taskId] = new Set())).add(event.step);
  } else if (event.kind === "approval_timeout") {
    // Nobody answered the plan/permission prompt in time — the backend already
    // resolved it as denied, so just drop the stale prompt from the UI too.
    delete pendingApprovals[taskId];
  } else if (event.kind === "task_done") {
    delete pendingApprovals[taskId];
    closeStream(taskId);
    // 🔥 แก้ไข: อัพเดท task status ทันที
    const task = tasks.find(t => t.task_id === taskId);
    if (task) {
      task.status = event.status || "done";
      task.result = event.result;
      task.error = event.error;
    }
    refreshTasks();
  }
  if (selectedConvId && conversationIdForTask(taskId) === selectedConvId) renderSelected();
  renderHistory();
}

async function respondApproval(taskId, requestId, approved) {
  delete pendingApprovals[taskId];
  renderHistory();
  if (selectedConvId && conversationIdForTask(taskId) === selectedConvId) renderSelected();
  try {
    await fetch(`${API}/tasks/${taskId}/respond`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ request_id: requestId, approved }),
    });
  } catch (e) {}
}

async function stopTask(taskId) {
  $("btnStop").disabled = true;
  try {
    await fetch(`${API}/tasks/${taskId}/stop`, { method: "POST" });
  } catch (e) {
  } finally {
    $("btnStop").disabled = false;
  }
}

// The × on a history entry — kills that session's browser resources right from the
// list, without first having to select it (same POST /sessions/{id}/close the
// "+ New session" button already calls when leaving a session behind — the session id
// IS the conversation id, see newSessionId()/requestPlan()). Stops a still-running task
// first so the browser isn't yanked out from under an active step. The conversation
// is permanently removed from the UI by adding its task_ids to deletedTaskIds,
// preventing refreshTasks() from recreating them.
// 🔥 แก้ไข: killSession() — sync deletedConvs → deletedTaskIds
async function killSession(convId) {
  // 1. หยุด task ที่กำลังรันอยู่ (ถ้ามี)
  const latest = latestTaskInConversation(convId);
  if (latest && latest.status === "running") {
    try {
      await fetch(`${API}/tasks/${latest.task_id}/stop`, { method: "POST" });
    } catch (e) {
      console.warn("Failed to stop task:", e);
    }
  }

  // 2. พยายามปิด session ที่ backend (ถ้ามี endpoint)
  try {
    await fetch(`${API}/sessions/${convId}/close`, { method: "POST" });
  } catch (e) {
    console.warn("Backend session close failed:", e);
  }

  // 3. เก็บ task_ids ทั้งหมดของ conversation นี้ลบลงใน deletedConvs และบันทึกลง localStorage
  const tasksToRemove = conversations[convId] || [];
  tasksToRemove.forEach(taskId => {
    deletedConvs[taskId] = true;
    deletedConvs["task-" + taskId] = true;
    deletedConvs["conv-" + taskId] = true;
    // 🔥 sync เข้า deletedTaskIds
    deletedTaskIds.add(taskId);
    deletedTaskIds.add("task-" + taskId);
    deletedTaskIds.add("conv-" + taskId);
  });
  deletedConvs[convId] = true;
  deletedConvs["conv-" + convId] = true;
  deletedTaskIds.add(convId);
  deletedTaskIds.add("conv-" + convId);

  // 4. ลบ conversation ออกจาก localStorage
  delete conversations[convId];
  saveConversations();
  saveDeletedConvs();


  // 5. ลบ tasks ออกจาก tasks array ทันที
  tasks = tasks.filter(task => !tasksToRemove.includes(task.task_id));

  // 6. ทำความสะอาด streams และ state ทั้งหมด
  tasksToRemove.forEach(taskId => {
    delete liveSteps[taskId];
    delete pendingApprovals[taskId];
    delete runningPlans[taskId];
    delete liveChatReplies[taskId];
    delete liveScreens[taskId];
    if (liveConnections[taskId]) {
      closeStream(taskId);
    }
  });

  // 7. ถ้ากำลังดู conversation นี้อยู่ ให้ reset การเลือก
  if (selectedConvId === convId) {
    setSelectedConvId(null);
    $("url").value = "https://www.saucedemo.com/";
    $("goal").value = "";
    $("composerError").textContent = "";
    learnProgress = null;
    siteManualStatus = null;
    checkSiteManualStatus();
  }

  // 8. รีเฟรช UI
  renderHistory();
  renderSelected();
}

// W13: plan review is 2 explicit steps now. requestPlan() asks the agent to draft a
// plan (POST /api/generate_plan — a single fast LLM call, no browser touched) and
// stores it as pendingPlan for local review; approvePlan() is what actually starts the
// task (POST /api/execute_plan) once the user is happy with it; cancelPlan() throws it
// away without ever having created anything server-side.
async function requestPlan() {
  const url = $("url").value.trim();
  const goal = $("goal").value.trim();
  $("composerError").textContent = "";
  if (!url || !goal) {
    $("composerError").textContent = "Please provide both a target URL and a goal.";
    return;
  }
  rememberUrl(url);
  if (pendingPlan) {
    $("composerError").textContent = "Approve or cancel the pending plan before requesting a new one.";
    return;
  }
  // Continuing an existing chat: don't let a follow-up overlap a turn that's still
  // running (each turn is its own independent browser run under the hood, so two
  // "in progress" turns in one thread would just be confusing, not actually parallel
  // work on the same page) — ask the user to wait or Stop the current one first.
  if (selectedConvId) {
    const latest = latestTaskInConversation(selectedConvId);
    if (latest && latest.status === "running") {
      $("composerError").textContent = "Wait for the current step to finish (or click Stop) before sending another command.";
      return;
    }
  }
  // W12: the session id IS the conversation id — generated client-side up front for a
  // brand-new conversation (rather than derived from the response afterward, like
  // before) so it can be sent to the backend and used to keep the same browser
  // page/context alive across every follow-up command in this thread instead of
  // reopening a fresh one each time (see core/session_registry.py). Every subsequent
  // turn in the same thread reuses the exact same id.
  const sessionId = selectedConvId || newSessionId();
  const requestParams = {
    max_steps: parseInt($("maxSteps").value, 10) || 30,
    provider: $("provider").value || null,
    headless: $("headless").checked,
    auto_approve: $("autoApprove").checked,
    use_user_browser: $("useUserBrowser").checked,
    tab_reuse_policy: $("useUserBrowser").checked ? $("tabReusePolicy").value : null,
  };
  planRequestInFlight = true;
  // W_instant: render the goal + a "Generating plan…" bubble right away — selecting this
  // conversation now (even though no task/pendingPlan exists yet) so it renders in the
  // right thread and, for a brand-new chat, so it doesn't look like nothing happened.
  planGenerating = { sessionId, goal };
  setSelectedConvId(sessionId);
  $("goal").value = "";
  renderHistory();
  renderSelected();
  try {
    const r = await fetch(API + "/api/generate_plan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url, goal, provider: requestParams.provider, session_id: sessionId }),
    });
    if (!r.ok) {
      const err = await r.text();
      $("composerError").textContent = "Failed to generate plan: " + err;
      $("goal").value = goal;
      return;
    }
    const res = await r.json();
    const plan = res.plan;
    const isQa = res.is_qa;

    if (isQa) {
      pendingPlan = null;
      planGenerating = null;
      await approvePlanWithPayload({ sessionId, url, goal, planDraft: "", requestParams });
      return;
    }

    // W_procmem: keep the raw fields from /api/generate_plan around so
    // approvePlanWithPayload() can decide whether the fast-path fields (template_id/
    // slot_values/steps) are still safe to forward — see the edited-plan check there.
    // originalPlanText is the exact text the server returned, before any user edits.
    pendingPlan = {
      sessionId, url, goal, planDraft: plan, requestParams, editing: false,
      originalPlanText: plan,
      source: res.source, templateId: res.template_id, slotValues: res.slot_values, steps: res.steps,
    };
  } finally {
    planRequestInFlight = false;
    planGenerating = null;
    renderHistory();
    renderSelected();
  }
}

async function approvePlanWithPayload(planPayload) {
  const {
    sessionId, url, goal, planDraft, requestParams,
    originalPlanText, source, templateId, slotValues, steps,
  } = planPayload;
  // W_urllock: this turn is actually starting now — re-lock the URL field (renderTopbar()
  // will sync it to the real value once refreshTasks() picks up the new task below), even
  // if the pencil was used to override it for this submission.
  urlUnlocked = false;
  // W_procmem: only forward the structured fast-path fields (template_id/slot_values/
  // steps) if the plan text is still exactly what the server returned — if the user
  // hand-edited it, those steps no longer necessarily match what was reviewed/approved,
  // so execute_plan must fall back to the normal slow path on the edited text instead of
  // silently running stale structured steps. isQa's synthetic payload has no
  // originalPlanText/source at all, so this is false there too, as intended.
  const planWasEdited = originalPlanText !== undefined && planDraft !== originalPlanText;
  const useFastpath = typeof source === "string" && source.startsWith("procedural_") && !planWasEdited && !!templateId;
  const payload = {
    url,
    goal,
    plan: planDraft,
    session_id: sessionId,
    max_steps: requestParams.max_steps,
    provider: requestParams.provider,
    headless: requestParams.headless,
    auto_approve: requestParams.auto_approve,
    use_user_browser: requestParams.use_user_browser,
    tab_reuse_policy: requestParams.tab_reuse_policy,
    execution_mode: useFastpath ? "fastpath" : null,
    template_id: useFastpath ? templateId : null,
    slot_values: useFastpath ? slotValues : null,
    steps: useFastpath ? steps : null,
  };
  try {
    const r = await fetch(API + "/api/execute_plan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!r.ok) {
      const err = await r.text();
      $("composerError").textContent = "Failed to start task: " + err;
      return;
    }
    const created = await r.json();
    if (planDraft) runningPlans[created.task_id] = planDraft;

    if (!conversations[sessionId]) conversations[sessionId] = [];
    conversations[sessionId].push(created.task_id);
    saveConversations();
    setSelectedConvId(sessionId);
    pendingPlan = null;

    liveSteps[created.task_id] = [];
    openStream(created.task_id);
    await refreshTasks();
  } catch (e) {
    $("composerError").textContent = "Failed to start task.";
  }
}

async function approvePlan() {
  if (!pendingPlan) return;
  const planPayload = pendingPlan;
  pendingPlan = null;
  await approvePlanWithPayload(planPayload);
}

function cancelPlan() {
  // Nothing was ever created server-side (no task, no session) — this is purely local
  // state being thrown away.
  pendingPlan = null;
  renderHistory();
  renderSelected();
}

function newSessionId() {
  if (window.crypto && crypto.randomUUID) return "sess-" + crypto.randomUUID();
  return "sess-" + Date.now() + "-" + Math.random().toString(36).slice(2);
}

function scheduleManualStatusCheck() {
  // Debounced — fires while typing a URL, don't hammer the endpoint on every keystroke.
  clearTimeout(manualCheckTimer);
  manualCheckTimer = setTimeout(checkSiteManualStatus, 400);
}

async function checkSiteManualStatus() {
  const url = $("url").value.trim();
  if (!url || learnProgress) {
    // Don't clobber an in-progress/just-finished learn banner with a stale "checking"
    // pass — learnProgress's own lifecycle (startLearningSite/openLearnStream) clears
    // itself and re-checks explicitly when it's actually done.
    if (!url) { siteManualStatus = null; renderManualBanner(); }
    return;
  }
  try {
    const r = await fetch(`${API}/api/site-manual/status?url=${encodeURIComponent(url)}`);
    siteManualStatus = r.ok ? await r.json() : null;
  } catch (e) {
    siteManualStatus = null;
  }
  renderManualBanner();
}

// W23: no upfront credential fields anymore — updates the Learn/Relearn button that
// now lives next to the Target URL field (see the chat-header markup) instead of
// inside this banner. Hidden while a crawl is already running (nothing to start).
function updateLearnButton() {
  const btn = $("btnLearnSite");
  if (learnProgress) {
    btn.style.display = "none";
    return;
  }
  if (siteManualStatus && siteManualStatus.exists === false) {
    btn.textContent = "เรียนรู้เว็บไซต์";
    btn.classList.remove("relearn");
    btn.style.display = "";
  } else if (siteManualStatus && siteManualStatus.exists === true) {
    // W16: เว็บไซต์อาจอัปเดตหน้าตา/โครงสร้างไปหลังจากเรียนรู้ครั้งก่อน — ให้กดเรียนรู้
    // ใหม่ทั้งเว็บได้ตลอด ไม่ต้องรอ manual หาย/พังก่อน (ต่างจาก relearn-page ที่ซ่อมทีละ
    // หน้าตอน selector ใช้งานไม่ได้ endpoint นี้เรียก POST /api/site-manual/learn ตัวเดิม
    // ซ้ำ — crawl ใหม่ทั้งเว็บ + bump version เหมือนเดิมทุกประการ)
    btn.textContent = "เรียนรู้ใหม่อีกรอบ";
    btn.classList.add("relearn");
    btn.style.display = "";
  } else {
    btn.style.display = "none";
  }
}
