          <div>Manual Version ${learnProgress.version ?? "?"} ถูกสร้างแล้ว</div>
          ${summaryHtml}
          ${learnProgress.errorsCount ? `<div class="manual-banner-errors">พบปัญหาระหว่างทาง ${learnProgress.errorsCount} รายการ (บางหน้า/ปุ่มอาจไม่ถูกสำรวจ)</div>` : ""}
        </div>`;
    } else {
      box.innerHTML = `
        <div class="manual-banner error">
          เรียนรู้เว็บไซต์ไม่สำเร็จ: ${escapeHtml(learnProgress.errorMessage || "unknown error")}
        </div>`;
    }
    box.style.display = "";
    return;
  }
  box.style.display = "none";
  box.innerHTML = "";
}

async function startLearningSite() {
  const url = $("url").value.trim();
  if (!url || learnProgress) return;
  // W24: errorCount/lastError ติดตามปัญหาที่เจอระหว่าง crawl (goto/click retry ครบแล้วยัง
  // ล้ม, login ที่ดูเหมือนไม่ผ่าน) — โชว์ในแบนเนอร์แทนการซ่อนไว้เงียบๆ (ดู renderManualBanner)
  learnProgress = {
    learnId: null, done: 0, total: 1, checklist: [], status: "running", currentUrl: url,
    credentialsRequest: null, errorCount: 0, lastError: null,
  };
  renderManualBanner();
  try {
    const r = await fetch(`${API}/api/site-manual/learn`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url, provider: $("provider").value || null }),
    });
    if (!r.ok) {
      learnProgress = { status: "error", errorMessage: await r.text() };
      renderManualBanner();
      return;
    }
    const created = await r.json();
    learnProgress.learnId = created.learn_id;
    openLearnStream(created.learn_id);
  } catch (e) {
    learnProgress = { status: "error", errorMessage: String(e) };
    renderManualBanner();
  }
}

function openLearnStream(learnId) {
  const es = new EventSource(`${API}/api/site-manual/learn/${learnId}/stream`);
  es.onmessage = (ev) => {
    let event;
    try { event = JSON.parse(ev.data); } catch (e) { return; }
    if (!learnProgress) { es.close(); return; }
    if (event.kind === "page_start") {
      learnProgress.currentUrl = event.url;
      learnProgress.currentButton = null;
      renderManualBanner();
    } else if (event.kind === "button_explored") {
      // W16: crawler กำลังไล่กดปุ่มปลอดภัยบนหน้านี้อยู่ (ดู crawler.py::_explore_buttons)
      // — โชว์ชื่อปุ่มที่กำลังลองกด คู่กับ browser จริงที่เปิดแบบมองเห็นได้
      learnProgress.currentButton = event.button;
      renderManualBanner();
    } else if (event.kind === "page_done") {
      learnProgress.done = event.done;
      learnProgress.total = event.total;
      learnProgress.checklist.push(event.name);
      renderManualBanner();
    } else if (event.kind === "login_result") {
      // W24: crawler ลอง login เสร็จแล้ว (ไม่ว่าจะผ่านหรือไม่) — โชว์ผลจริงแทนที่จะเงียบไป
      if (!event.success) {
        learnProgress.errorCount += 1;
        learnProgress.lastError = `Login ไม่สำเร็จ: ${event.reason || "ไม่ทราบสาเหตุ"}`;
      }
      renderManualBanner();
    } else if (event.kind === "page_error" || event.kind === "button_click_failed") {
      // W24: goto/click ที่ retry ครบแล้วยังล้ม — นับรวมไว้โชว์เป็นสรุปจำนวน ไม่ทำให้ crawl
      // หยุด (ดู core crawler.py — ข้ามหน้า/ปุ่มนั้นแล้วไปต่อ)
      learnProgress.errorCount += 1;
      learnProgress.lastError = event.error || "";
      renderManualBanner();
    } else if (event.kind === "credentials_needed") {
      // W23: crawler เจอหน้า login ที่ยังไม่มี username/password ให้เลย — หยุดรอ user
      // ตอบผ่าน respondLearnCredentials() ด้านล่าง (POST .../credentials) ก่อนไปต่อ
      learnProgress.credentialsRequest = { requestId: event.request_id, domain: event.domain };
      renderManualBanner();
    } else if (event.kind === "credentials_timeout") {
      // ไม่มีใครตอบทันเวลา — backend auto-skip ไปแล้ว (ดู LearnManager.request_credentials())
      // แค่เคลียร์ฟอร์มที่ค้างอยู่ทิ้ง ไม่ใช่ error
      learnProgress.credentialsRequest = null;
      renderManualBanner();
    } else if (event.kind === "learn_done") {
      es.close();
      if (event.status === "done") {
        learnProgress = {
          status: "done",
          version: event.result ? event.result.version : null,
          errorsCount: event.result ? (event.result.errors_count || 0) : 0,
          summary: event.result ? (event.result.summary || "") : "",
        };
      } else {
        learnProgress = { status: "error", errorMessage: event.error || "" };
      }
      renderManualBanner();
      // Re-check for real (not just trusting our own optimistic state) so the banner
      // fully clears once storage confirms the manual actually exists on disk now.
      setTimeout(() => { learnProgress = null; checkSiteManualStatus(); }, 2500);
    }
  };
  es.onerror = () => { es.close(); };
}

// W23: answers a "credentials_needed" prompt — username/password both null means the
// user chose to skip ("ข้าม"), which the backend treats as "continue without logging
// in" rather than an error (see LearnManager.resolve_credentials()). Clears the pending
// request optimistically right away so the form doesn't linger while the fetch is in
// flight; the next SSE event (page_start/page_done/etc.) confirms the crawl actually
// moved on.
async function respondLearnCredentials(username, password) {
  if (!learnProgress || !learnProgress.credentialsRequest || !learnProgress.learnId) return;
  const requestId = learnProgress.credentialsRequest.requestId;
  learnProgress.credentialsRequest = null;
  renderManualBanner();
  try {
    await fetch(`${API}/api/site-manual/learn/${learnProgress.learnId}/credentials`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ request_id: requestId, username, password }),
    });
  } catch (e) {}
}

// ---------------- Rendering ----------------

// 🔥 แก้ไข: renderHistory() — แสดง badge ตาม result จริง
function renderHistory() {
  $("btnNewSession").classList.toggle("active", selectedConvId === null);
  const list = $("historyList");
  const convIds = Object.keys(conversations).filter((id) => tasksInConversation(id).length > 0);
  if (!convIds.length) {
    list.innerHTML = '<div class="empty-hint">No tasks yet — start one below.</div>';
    return;
  }
  // Most recently active conversation first (matches typical chat-app ordering).
  convIds.sort((a, b) => latestTaskInConversation(b).created_at - latestTaskInConversation(a).created_at);

  let html = "";
  let lastGroup = null;
  for (const convId of convIds) {
    const convTasks = tasksInConversation(convId);
    const first = convTasks[0];
    const latest = convTasks[convTasks.length - 1];
    const group = dayLabel(latest.created_at);
    if (group !== lastGroup) {
      html += `<div class="history-group">${group}</div>`;
      lastGroup = group;
    }
    // 🔥 ตรวจสอบ status จาก task จริง + result
    let status = (latest.status || "running").toLowerCase();
    if (status === "running" && latest.result) {
      status = latest.result.success ? "done" : "error";
    }
    const needsApproval = !!pendingApprovals[latest.task_id];
    const badge = needsApproval
      ? '<span class="badge needs-approval">action needed</span>'
      : `<span class="badge ${status}">${status}</span>`;
    const turnCount = convTasks.length > 1 ? `<span class="mono">${convTasks.length}&times;</span>` : "";
    const tokensLabel = formatTokens(sumConvTokens(convTasks));
    const tokens = tokensLabel ? `<span class="mono tokens">${tokensLabel}</span>` : "";
    html += `
      <div class="list-item-wrap">
        <button class="list-item ${convId === selectedConvId ? "active" : ""}" data-conv-id="${convId}">
          <div class="title">${escapeHtml(first.goal)}</div>
          <div class="meta"><span class="mono">${fmtTime(latest.created_at)}</span>${turnCount}${tokens}${badge}</div>
        </button>
        <button class="kill-session-btn" data-kill-conv="${convId}" title="Close this session">&times;</button>
      </div>`;
  }
  list.innerHTML = html;
  list.querySelectorAll(".list-item").forEach((el) => {
    el.addEventListener("click", () => {
      if (pendingPlan && pendingPlan.sessionId !== el.dataset.convId) {
        $("composerError").textContent = "Approve or cancel the pending plan before switching conversations.";
        return;
      }
      urlUnlocked = false; // switching threads — don't carry an in-progress URL edit over
      setSelectedConvId(el.dataset.convId);
      const latest = latestTaskInConversation(selectedConvId);
      if (latest) {
        // renderTopbar() (called via renderSelected() below) also syncs+locks this, but set
        // it here too so provider/openStream below don't run a beat ahead of a blank field.
        $("url").value = latest.url;
        if (latest.provider) $("provider").value = latest.provider;
        if (latest.status === "running") openStream(latest.task_id);
      }
      renderHistory();
      renderSelected();
      learnProgress = null;
      checkSiteManualStatus();
    });
  });
  list.querySelectorAll(".kill-session-btn").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const convId = btn.dataset.killConv;
      if (convId) {
        killSession(convId);
      }
    });
  });
}

// 🔥 แก้ไข: statusMeta() — เช็ค task.result โดยตรง
function statusMeta(task) {
  if (!task) {
    if (pendingPlan && pendingPlan.sessionId === selectedConvId) return { cls: "running", label: "Reviewing plan" };
    if (planGenerating && planGenerating.sessionId === selectedConvId) return { cls: "running", label: "Generating plan" };
    return { cls: "idle", label: "Idle" };
  }
  if (pendingApprovals[task.task_id]) return { cls: "error", label: "Needs approval" };
  const s = (task.status || "running").toLowerCase();
  // 🔥 ถ้า status ยังเป็น "running" แต่มี result แล้ว → แสดงตาม result
  if (s === "running") {
    if (task.result) {
      if (task.result.status === "chat_reply") return { cls: "done", label: "Done" };
      return task.result.success ? { cls: "done", label: "Done" } : { cls: "error", label: "Failed" };
    }
    return { cls: "running", label: "Running" };
  }
  if (s === "cancelled") return { cls: "cancelled", label: "Stopped" };
  if (s === "error") return { cls: "error", label: "Error" };
  if (task.result && task.result.success === false) return { cls: "error", label: "Failed" };
  return { cls: "done", label: "Done" };
}

// 🔥 แก้ไข: renderTopbar() — จัดการปุ่ม Stop/Send ตามสถานะจริง
function renderTopbar(convTasks) {
  const pending = pendingPlan && pendingPlan.sessionId === selectedConvId ? pendingPlan : null;
  const generating = planGenerating && planGenerating.sessionId === selectedConvId ? planGenerating : null;
  const first = convTasks.length ? convTasks[0] : (pending || generating);
  const latest = convTasks.length ? convTasks[convTasks.length - 1] : null;
  $("sessionName").innerHTML = first
    ? `Session &mdash; <b>${escapeHtml(truncate(first.goal, 70))}</b>${convTasks.length > 1 ? ` <span class="mono" style="color:var(--faint)">(${convTasks.length} turns)</span>` : ""}`
    : "New session";
  const meta = statusMeta(latest);
  const pill = $("statusPill");
  pill.className = "status-pill " + meta.cls;
  $("statusText").textContent = meta.label;

  // 🔥 จัดการปุ่ม Stop/Send ตามสถานะจริง
  const stopBtn = $("btnStop");
  const goalInput = $("goal");
  
  if (latest && latest.status === "running") {
    // กำลังรัน → แสดงปุ่ม Stop
    stopBtn.style.display = "";
    stopBtn.dataset.task = latest.task_id;
    stopBtn.title = "Stop task";
    stopBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>`;
    stopBtn.onclick = () => {
      const taskId = stopBtn.dataset.task;
      if (taskId) stopTask(taskId);
    };
    goalInput.placeholder = "Task is running...";
  } else if (latest && latest.status !== "running") {
    // 🔥 Task จบแล้ว → แสดงปุ่ม Send
    stopBtn.style.display = "";
    delete stopBtn.dataset.task;
    stopBtn.title = "Send command (Enter)";
    stopBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`;
    stopBtn.style.background = "var(--accent)";
    stopBtn.style.color = "var(--accent-ink)";
    stopBtn.onclick = () => {
      if (!planRequestInFlight) requestPlan();
    };
    // 🔥 แสดงสถานะใน placeholder
    const s = (latest.status || "").toLowerCase();
    if (s === "done" || (latest.result && latest.result.success)) {
      goalInput.placeholder = "Task completed! Enter a follow-up command...";
    } else if (s === "cancelled") {
      goalInput.placeholder = "Task was stopped. Enter a new command...";
    } else if (s === "error" || (latest.result && latest.result.success === false)) {
      goalInput.placeholder = "Task failed. Enter a new command...";
    } else {
      goalInput.placeholder = "e.g. add the first item to cart and checkout";
    }
  } else {
    // ไม่มี task เลย → แสดงปุ่ม Send
    stopBtn.style.display = "";
    delete stopBtn.dataset.task;
    stopBtn.title = "Send command (Enter)";
    stopBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`;
    stopBtn.style.background = "var(--accent)";
    stopBtn.style.color = "var(--accent-ink)";
    stopBtn.onclick = () => {
      if (!planRequestInFlight) requestPlan();
    };
    goalInput.placeholder = "e.g. add the first item to cart and checkout";
  }

  // W_urllock: once a turn exists, the URL that actually ran is a historical fact — lock
  // the field (readonly, synced to that turn's real URL) so it can't be edited into looking
  // like something different was used. The pencil button is the deliberate escape hatch for
  // the one legitimate case: overriding the target for the *next* follow-up turn. Skipped
  // entirely while urlUnlocked is true so this doesn't fight an in-progress edit on every
  // 2.5s task poll (see urlUnlocked declaration).
  const urlInput = $("url");
  const editBtn = $("btnEditUrl");
  if (urlUnlocked) {
    urlInput.readOnly = false;
    editBtn.style.display = "none";
  } else if (latest) {
    urlInput.value = latest.url;
    urlInput.readOnly = true;
    editBtn.style.display = "";
  } else {
    urlInput.readOnly = false;
    editBtn.style.display = "none";
  }
}

// Renders one turn (a single task run) of the conversation — a user bubble with the
// goal, followed by the agent's plan/permission/progress/result for that turn.
function renderTaskTurn(task) {
  let html = `
    <div class="msg user">
      <div class="avatar">You</div>
      <div>
        <div class="bubble">${escapeHtml(task.goal)}</div>
      </div>
    </div>`;

  const agentIcon = `<svg viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 1 1 8 8" stroke="white" stroke-width="2.6" stroke-linecap="round"/></svg>`;

  const pending = pendingApprovals[task.task_id];
  const isChatReply = (task.result && task.result.status === "chat_reply") || !!liveChatReplies[task.task_id];

  if (isChatReply) {
    const replyMsg = (task.result && task.result.message) || liveChatReplies[task.task_id] || "";
    html += `
      <div class="msg agent">
        <div class="avatar">${agentIcon}</div>
        <div>
          <div class="bubble">${escapeHtml(replyMsg)}</div>
        </div>
      </div>`;
    return html;
  }

  // W_planrail: the approved plan itself no longer renders as a chat bubble here — once
  // approved it "jumps" to the persistent right-rail Plan panel instead (see
  // renderPlanPanel()), so it stays visible and keeps ticking in real time without
  // scrolling out of view as the conversation grows. This function only covers what's
  // still actually chat-shaped: the pending *review* bubble (renderPendingPlanTurn(),
  // before approval) and the turn's own progress/result messages below.

  if (task.status === "running") {
    if (pending && pending.cmd) {
      html += `
        <div class="msg agent">
          <div class="avatar">${agentIcon}</div>
          <div>
            <div class="bubble approval-bubble">
              <div class="approval-title">Permission needed</div>
              <div class="approval-cmd">${escapeHtml(pending.cmd.element_label || describeCmd({ cmd: pending.cmd, label: pending.cmd.element_label }))}</div>
              <div class="approval-actions">
                <button class="btn-approve" data-task="${task.task_id}" data-request="${pending.request_id}" data-approve="true">Approve</button>
                <button class="btn-deny" data-task="${task.task_id}" data-request="${pending.request_id}" data-approve="false">Deny</button>
              </div>
            </div>
          </div>
        </div>`;
    } else {
      // Step-by-step detail already lives in the Log panel and the Plan checklist — this
      // bubble just needs to say a turn is in flight, not repeat that in prose every render.
      html += `
        <div class="msg agent">
          <div class="avatar">${agentIcon}</div>
          <div>
            <div class="bubble">Working&hellip;</div>
          </div>
        </div>`;
    }
  } else if (task.status === "cancelled") {
    html += `
      <div class="msg agent">
        <div class="avatar">${agentIcon}</div>
        <div>
          <div class="bubble">Stopped by you.</div>
        </div>
      </div>`;
  } else if (task.status === "error") {
    html += `
      <div class="msg agent error">
        <div class="avatar">${agentIcon}</div>
        <div>
          <div class="bubble">The task ended with an error before finishing:<br>${escapeHtml(task.error || "unknown error")}</div>
        </div>
      </div>`;
  } else if (task.result) {
    const r = task.result;
    html += `
      <div class="msg agent ${r.success ? "" : "error"}">
        <div class="avatar">${agentIcon}</div>
        <div>
          <div class="bubble">${escapeHtml(r.message || (r.success ? "Done." : "Did not finish successfully."))}</div>
          <div class="stat-line"><span>${r.steps} step${r.steps === 1 ? "" : "s"}</span>${r.tokens && r.tokens.total ? `<span>${r.tokens.total} tokens</span>` : ""}</div>
        </div>
      </div>`;
  }
  return html;
}

// Full chat transcript for the selected conversation: every turn (task) in submission
// order, so a follow-up command shows up right below the previous turn instead of
// replacing it — this is what lets you keep chatting without starting a new session.
//
// Two anti-jump fixes here (renderSelected() re-runs this on every SSE event AND every
// 2.5s task poll, not just on real changes):
//  1. "Sticky bottom" scrolling — only force-scroll to the newest message if the user
//     was already near the bottom before this re-render. Otherwise a poll firing while
//     someone's scrolled up reading history used to yank them straight back down.
//  2. Skip re-rendering entirely while the plan-edit textarea is open — convTasks/pending
//     can't legitimately change while a plan is being edited (requestPlan() already
//     blocks starting a new plan while the previous task is still running, and nothing
//     else touches this conversation until Approve/Cancel/Done, which call
//     renderSelected() themselves) — replacing innerHTML here would tear down the live
//     textarea and reset the cursor/selection mid-keystroke for no reason.
function renderTranscript(convTasks) {
  const box = $("transcript");
  const pending = pendingPlan && pendingPlan.sessionId === selectedConvId ? pendingPlan : null;
  const generating = planGenerating && planGenerating.sessionId === selectedConvId ? planGenerating : null;
  if (pending && pending.editing && box.querySelector("#pendingPlanTextarea")) {
    return;
  }
  if (!convTasks.length && !pending && !generating) {
    box.innerHTML = '<div class="transcript-empty">Set a target URL and goal below, then click "Plan task" to draft a plan and start a new session.</div>';
    return;
  }
  const wasNearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  let html = convTasks.map(renderTaskTurn).join("");
  if (generating) html += renderGeneratingPlanTurn(generating);
  if (pending) html += renderPendingPlanTurn(pending);
  box.innerHTML = html;
  if (wasNearBottom) box.scrollTop = box.scrollHeight;
}

// W_instant: optimistic bubble shown the instant the user submits a goal, before
// /api/generate_plan has responded — see planGenerating (set in requestPlan()). Mirrors
// the "Working…" bubble renderTaskTurn() shows for a running task, just for the plan
// drafting call instead of an actual browser action.
function renderGeneratingPlanTurn(generating) {
  const agentIcon = `<svg viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 1 1 8 8" stroke="white" stroke-width="2.6" stroke-linecap="round"/></svg>`;
  return `
    <div class="msg user">
      <div class="avatar">You</div>
      <div>
        <div class="bubble">${escapeHtml(generating.goal)}</div>
      </div>
    </div>
    <div class="msg agent">
      <div class="avatar">${agentIcon}</div>
      <div>
        <div class="bubble">Generating plan&hellip;</div>
      </div>
    </div>`;
}

// W13: a plan awaiting local review — not a task yet (no task_id, no backend state at
// all), so this is driven entirely by the pendingPlan object rather than SSE/polling.
// W20: view/edit toggle brought back (like the old task-based plan flow) — default is
// a read-only view (.plan-bubble-text, no scrolling needed — grows to fit the whole
// plan) with an explicit "Edit" button; clicking it swaps in a textarea sized (via
// `rows`) to the plan's actual line count so the full text is visible without an
// internal scrollbar either. Textarea edits already live-sync into pending.planDraft
// via the document-level "input" listener below, so there's no separate save/discard
// step — "Done editing" just switches the view back.
function renderPendingPlanTurn(pending) {
  const agentIcon = `<svg viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 1 1 8 8" stroke="white" stroke-width="2.6" stroke-linecap="round"/></svg>`;
  const rows = Math.max(6, pending.planDraft.split("\n").length + 1);
  const bodyHtml = pending.editing
    ? `
          <textarea class="plan-edit-textarea" id="pendingPlanTextarea" rows="${rows}">${escapeHtml(pending.planDraft)}</textarea>
          <div class="approval-actions">
            <button class="btn-approve" data-approve-plan="true">Approve &amp; Run</button>
            <button class="btn-edit" data-plan-edit-done="true">Done editing</button>
            <button class="btn-deny" data-cancel-plan="true">Cancel</button>
          </div>`
    : `
          ${renderPlanPreviewList(pending.planDraft)}
          <div class="approval-actions">
            <button class="btn-approve" data-approve-plan="true">Approve &amp; Run</button>
            <button class="btn-edit" data-plan-edit="true">Edit</button>
            <button class="btn-deny" data-cancel-plan="true">Cancel</button>
          </div>`;
  return `
    <div class="msg user">
      <div class="avatar">You</div>
      <div>
        <div class="bubble">${escapeHtml(pending.goal)}</div>
      </div>
    </div>
    <div class="msg agent">
      <div class="avatar">${agentIcon}</div>
      <div>
        <div class="bubble plan-bubble">
          <div class="plan-bubble-title">Plan<span class="plan-badge fail">awaiting approval</span></div>
          ${bodyHtml}
        </div>
      </div>
    </div>`;
}

function renderLogLine(h) {
  const lvl = h.cmd && h.cmd.type === "goto" ? "info" : (h.success ? "ok" : "err");
  return `
    <div class="log-line">
      <span class="t">${h.step ?? ""}</span>
      <span class="lvl ${lvl}">${lvl}</span>
      <span class="msg-text">${escapeHtml(describeCmd(h))}</span>
    </div>
    <div class="log-line" style="padding-top:0;">
      <span class="t"></span>
      <span class="lvl"></span>
      <span class="result-text">${escapeHtml(truncate(h.result, 160))}</span>
    </div>`;
}

function renderLog(task) {
  const body = $("logBody");
  const count = $("logCount");
  count.textContent = "";
  if (!task) {
    body.innerHTML = '<div class="log-placeholder">Select or start a task to see its step log.</div>';
    return;
  }
  if ((task.result && task.result.status === "chat_reply") || liveChatReplies[task.task_id]) {
    body.innerHTML = '<div class="log-placeholder">No action log for chat response.</div>';
    return;
  }
  const history = task.result && task.result.history;
  // ยังไม่มี history สุดท้าย (running อยู่ หรือถูก stop ก่อนจะได้ผลลัพธ์กลับมา) — โชว์
  // live steps ที่สตรีมมาแล้วแทน ดีกว่าไม่โชว์อะไรเลย (เห็นว่า agent ทำไปถึงไหนก่อนหยุด)
  const steps = (history && history.length) ? history : (liveSteps[task.task_id] || []);
  if (!steps.length) {
    body.innerHTML = task.status === "running"
      ? '<div class="log-placeholder">Waiting for the first step&hellip;</div>'
      : '<div class="log-placeholder">No steps recorded for this task.</div>';
    return;
  }
  const liveSuffix = task.status === "running" ? " (live)" : "";
  count.textContent = `${steps.length} step${steps.length === 1 ? "" : "s"}${liveSuffix}`;
  body.innerHTML = steps.map(renderLogLine).join("");
  if (task.status === "running") body.scrollTop = body.scrollHeight;
}

// W_planrail: the approved plan for the current turn, rendered in the right-rail Plan panel
// (see updateRightRailVisibility() for when the panel itself shows/hides). Returns whether a
// plan actually exists to render, so the caller doesn't need to duplicate that check.
function renderPlanPanel(latest) {
  const badgeSlot = $("planBadgeSlot");
  const body = $("planBody");
  const planText = latest && (runningPlans[latest.task_id] || (latest.result && latest.result.plan)) || "";
  if (!planText) return false;
  const planSteps = parsePlanSteps(planText);
  const doneSteps = completedPlanSteps[latest.task_id] || new Set();
  // W_planbug: a task can reach finish_task successfully without every single action along
  // the way having carried a correct completed_plan_step marker (that's the LLM's own,
  // best-effort self-report per action — see orchestrator.py::completed_plan_step) — the
  // task's own success is the more reliable signal, so once it's done successfully every
  // step counts as done regardless of which individual "plan_step_done" events actually
  // arrived. Fixes checklists that finished the real task but were left with unticked rows.
  const allDone = !!(latest.result && latest.result.success);
  badgeSlot.innerHTML = latest.result
    ? `<span class="plan-badge ${latest.result.success ? "ok" : "fail"}">${latest.result.success ? "Done" : "Failed"}</span>`
    : `<span class="plan-badge running">Running</span>`;
  body.innerHTML = planSteps.length
    ? `<ul class="plan-checklist">${planSteps.map((step) => {
        const done = allDone || doneSteps.has(step.index);
        return `<li class="plan-checklist-item${done ? " done" : ""}">
              <span class="plan-checklist-box">${done ? "✓" : ""}</span>
              <span class="plan-checklist-text">${escapeHtml(step.text)}</span>
            </li>`;
      }).join("")}</ul>`
    : `<div class="plan-bubble-text">${escapeHtml(planText)}</div>`;
  return true;
}

function renderSelected() {
  const convTasks = selectedConvId ? tasksInConversation(selectedConvId) : [];
  const latest = convTasks.length ? convTasks[convTasks.length - 1] : null;
  renderTopbar(convTasks);
  renderLiveView(latest);
  renderTranscript(convTasks);
  renderLog(latest);
  const hasPlan = renderPlanPanel(latest);
  updateRightRailVisibility(hasPlan);
}

// W_live: shows the latest screenshot for the selected conversation's current turn (falls
// back to the placeholder if none has arrived yet — brand-new conversation, or a turn that
// hasn't reached its first step yet). Kept separate from renderTranscript() so a fast stream
// of "screenshot" events doesn't have to re-render the whole chat log every time.
function renderLiveView(latest) {
  const wrap = $("liveView");
  // W_live: a brand-new/"new session" conversation has no task yet at all (latest === null)
  // — don't reserve the box (and its placeholder text) for that state; only reveal it once
  // the first task has actually been submitted for this conversation, same moment the
  // transcript below starts showing that first turn's plan/chat bubble.
  // W_live: headless===false means this task's browser window is open and visible (user
  // unchecked "Headless" to interact with it directly, e.g. to solve a CAPTCHA) — the
  // backend skips streaming screenshots entirely in that case (see orchestrator.py::
  // _emit_screenshot), so keeping the box around would just show a permanently-empty
  // placeholder. Hide it instead; the real window is the live view now.
  if (!latest || latest.headless === false) {
    wrap.style.display = "none";
    $("liveViewDivider").style.display = "none";
    return;
  }
  wrap.style.display = "";
  $("liveViewDivider").style.display = "";
  const img = $("liveViewImg");
  const placeholder = $("liveViewPlaceholder");
  const src = liveScreens[latest.task_id];
  if (src) {
    img.src = src;
    img.style.display = "";
    placeholder.style.display = "none";
  } else {
    img.removeAttribute("src");
    img.style.display = "none";
    placeholder.style.display = "";
  }
  // Re-fit even when img.src didn't change (so it won't fire "load" again) — the column's
  // available width can still have changed since last render (e.g. Log panel just toggled).
  fitLiveView();
}

// W_live: caps the box at this height (px) — big enough to actually watch the agent work,
// small enough to always leave room for chat/plan below it. Tune here, not scattered in CSS.
const LIVE_VIEW_MAX_HEIGHT = 380;

// W_live: computes the box's exact pixel width+height together from ONE source (whichever of
// "available column width" or LIVE_VIEW_MAX_HEIGHT is more restrictive), so the box's own
// rendered ratio always equals the real screenshot's ratio exactly — no bars, no cropping,
// and never taller than the cap. Two earlier CSS-only attempts each solved half the problem:
// aspect-ratio+max-height let max-height win while width stayed column-driven (ratio broke,
// bars came back); aspect-ratio with no cap fixed the bars but let the box swallow the whole
// screen on a tall/wide window (no room left for chat — exactly what was just reported). No-op
// before any frame has loaded (natural size is 0x0 — the placeholder state keeps whatever size
// the last real frame left it at, or the CSS default if there's never been one).
function fitLiveView() {
  const img = $("liveViewImg");
  const w = img.naturalWidth, h = img.naturalHeight;
  if (!w || !h) return;
  const wrap = $("liveView");
  // Read the side margin from computed style rather than hardcoding it — the mobile
  // breakpoint (see @media max-width:920px) sets a smaller margin than desktop.
  const style = getComputedStyle(wrap);
  const sideMargin = parseFloat(style.marginLeft) + parseFloat(style.marginRight);
  const maxWidth = wrap.parentElement.clientWidth - sideMargin;
  const ratio = w / h;
  let boxHeight = Math.min(LIVE_VIEW_MAX_HEIGHT, maxWidth / ratio);
  let boxWidth = boxHeight * ratio;
  if (boxWidth > maxWidth) {
    boxWidth = maxWidth;
    boxHeight = boxWidth / ratio;
  }
  wrap.style.width = `${boxWidth}px`;
  wrap.style.height = `${boxHeight}px`;
}
$("liveViewImg").addEventListener("load", fitLiveView);
window.addEventListener("resize", fitLiveView);

// ---------------- Right rail visibility (Plan panel + manual "Show log" toggle) ----------------

// W_planrail: single source of truth for the right rail as a whole — the Plan panel shows
// automatically once a plan exists for the selected turn (see renderPlanPanel()), the Log
// panel only on the user's manual "Show log" toggle; the rail's own grid column is visible
// whenever *either* one is. When both are visible, right-rail's flex:1 columns (see CSS)
// split the height 50/50 with no extra math needed here.
function updateRightRailVisibility(hasPlan) {
  $("planPanel").style.display = hasPlan ? "" : "none";
  $("logPanel").style.display = logVisible ? "" : "none";
  $("mainGrid").classList.toggle("right-rail-hidden", !(hasPlan || logVisible));
  $("btnToggleLog").textContent = logVisible ? "Hide log" : "Show log";
  $("btnToggleLog").classList.toggle("active", logVisible);
}

// ---------------- Theme ----------------

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem("agentConsoleTheme", theme);
  $("themeToggle").querySelectorAll("button").forEach((b) => {
    b.classList.toggle("active", b.dataset.theme === theme);
  });
}

// ---------------- Wiring ----------------

// "Use my browser" bypasses headless entirely (agent connects to your already-running
// Chrome via CDP instead of launching one) — grey out "Headless" while it's checked so
// it's clear the setting has no effect in that mode.
$("useUserBrowser").addEventListener("change", () => {
  const active = $("useUserBrowser").checked;
  $("headless").disabled = active;
  if (active) $("headless").checked = false;
  $("tabReusePolicyRow").style.display = active ? "" : "none";
});

$("btnStop").addEventListener("click", () => {
  const taskId = $("btnStop").dataset.task;
  if (taskId) stopTask(taskId);
});
$("btnNewSession").addEventListener("click", async () => {
  const oldSessionId = selectedConvId;
  if (oldSessionId) {
    // Don't close the browser resources out from under a task that's still running on
    // them — same guard requestPlan() already uses before sending a follow-up.
    const latest = latestTaskInConversation(oldSessionId);
    if (latest && latest.status === "running") {
      $("composerError").textContent = "Wait for the current step to finish (or click Stop) before starting a new session.";
      return;
    }
  }
  if (pendingPlan && pendingPlan.sessionId === oldSessionId) pendingPlan = null;
  urlUnlocked = false;
  setSelectedConvId(null);
  renderHistory();
  renderSelected();
  if (oldSessionId) {
    try { await fetch(`${API}/sessions/${oldSessionId}/close`, { method: "POST" }); } catch (e) {}
  }
});
$("btnToggleLog").addEventListener("click", () => {
  logVisible = !logVisible;
  renderSelected();
});
$("btnEditUrl").addEventListener("click", () => {
  urlUnlocked = true;
  renderSelected();
  const urlInput = $("url");
  urlInput.focus();
  urlInput.select();
});
$("themeToggle").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-theme]");
  if (btn) applyTheme(btn.dataset.theme);
});

// ---------------- Settings dropdown (topbar) ----------------
// Houses: theme toggle, Show log toggle, provider/max steps/headless/use-my-browser/
// auto-approve — all moved here from the topbar/composer so those stay uncluttered.
// Same ids as before, just relocated, so every other wiring above (theme, log
// visibility, requestPlan() reading provider/maxSteps/etc.) keeps working untouched.
$("btnSettings").addEventListener("click", (e) => {
  e.stopPropagation();
  $("settingsPanel").classList.toggle("open");
  $("btnSettings").classList.toggle("active", $("settingsPanel").classList.contains("open"));
});
$("settingsPanel").addEventListener("click", (e) => e.stopPropagation());
document.addEventListener("click", () => {
  $("settingsPanel").classList.remove("open");
  $("btnSettings").classList.remove("active");
  $("attachMenu").classList.remove("open");
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    $("settingsPanel").classList.remove("open");
    $("btnSettings").classList.remove("active");
    $("attachMenu").classList.remove("open");
  }
  // W_planenter: Enter confirms a pending plan (like clicking "Approve & Run") from
  // anywhere on the page — except while the plan-edit textarea is focused, where Enter
  // must keep inserting a newline instead. The goal composer has its own Enter handler
  // (below) that defers to this one whenever a plan is already pending.
  if (
    e.key === "Enter" && !e.shiftKey &&
    pendingPlan && !pendingPlan.editing &&
    e.target.id !== "pendingPlanTextarea"
  ) {
    e.preventDefault();
    approvePlan();
  }
});

// ---------------- Attach-file menu (composer "+") ----------------
// UI shell only, per request — reading/uploading a file isn't implemented yet. The
// menu item's click handler below just closes the menu; nothing is read, stored, or
// sent anywhere yet.
$("btnAttach").addEventListener("click", (e) => {
  e.stopPropagation();
  $("attachMenu").classList.toggle("open");
});
// No stopPropagation on the menu itself (unlike settingsPanel) — its one menu item is
// supposed to close the menu on click via the delegated [data-attach-placeholder]
// handler further down, which needs the click to actually bubble to document.
document.addEventListener("click", (e) => {
  if (e.target.closest("[data-approve-plan]")) {
    approvePlan();
    return;
  }
  if (e.target.closest("[data-cancel-plan]")) {
    cancelPlan();
    return;
  }
  if (e.target.closest("[data-plan-edit]")) {
    if (pendingPlan) { pendingPlan.editing = true; renderSelected(); }
    return;
  }
  if (e.target.closest("[data-plan-edit-done]")) {
    if (pendingPlan) { pendingPlan.editing = false; renderSelected(); }
    return;
  }
  if (e.target.closest("[data-learn-site]")) {
    startLearningSite();
    return;
  }
  if (e.target.closest("[data-submit-learn-credentials]")) {
    const u = document.getElementById("credReqUsername");
    const p = document.getElementById("credReqPassword");
    respondLearnCredentials(u && u.value ? u.value : null, p && p.value ? p.value : null);
    return;
  }
  if (e.target.closest("[data-skip-learn-credentials]")) {
    respondLearnCredentials(null, null);
    return;
  }
  const killBtn = e.target.closest("[data-kill-conv]");
  if (killBtn) {
    killSession(killBtn.dataset.killConv);
    return;
  }
  if (e.target.closest("[data-attach-placeholder]")) {
    // Not implemented yet — see the composer "+" comment above. Just closes the menu.
    $("attachMenu").classList.remove("open");
    return;
  }
  const btn = e.target.closest("[data-approve]");
  if (!btn) return;
  respondApproval(btn.dataset.task, btn.dataset.request, btn.dataset.approve === "true");
});
document.addEventListener("input", (e) => {
  // Keep the pending plan's draft in sync on every keystroke so a periodic re-render
  // (e.g. the 2.5s task poll) reconstructs the textarea with what's actually been
  // typed, not stale text.
  if (e.target.id === "pendingPlanTextarea" && pendingPlan) {
    pendingPlan.planDraft = e.target.value;
  }
});
$("url").addEventListener("input", scheduleManualStatusCheck);

// Enter submits the goal (like a chat input, no separate send button) — Shift+Enter
// still inserts a newline for a multi-line goal. requestPlan() itself already re-checks
// pendingPlan as a safety net; this just avoids double-firing while its own fetch is
// still in flight (there's a moment before pendingPlan is set where a second Enter
// press would otherwise slip through).
$("goal").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    // A pending plan already showing (awaiting Approve/Edit/Cancel) means Enter here
    // should confirm it instead of trying to start a second one — the document-level
    // keydown handler above (W_planenter) handles that since this event still bubbles.
    if (pendingPlan) return;
    if (!planRequestInFlight) requestPlan();
  }
});

const savedTheme = localStorage.getItem("agentConsoleTheme")
  || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
applyTheme(savedTheme);

renderUrlHistory();
renderSelected();
checkHealth();
refreshPool();
refreshTasks();
checkSiteManualStatus();
setInterval(checkHealth, 5000);
setInterval(refreshPool, 5000);
setInterval(refreshTasks, 2500);
</script>
</body>
